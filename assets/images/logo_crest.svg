<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Rich 24K Gold Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA7C11"/>
      <stop offset="75%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#8C6207"/>
    </linearGradient>

    <radialGradient id="discBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1815"/>
      <stop offset="70%" stop-color="#0E0D0B"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2419"/>
      <stop offset="50%" stop-color="#1C1810"/>
      <stop offset="100%" stop-color="#0F0C07"/>
    </linearGradient>

    <!-- Drop Shadows for 3D Relief -->
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Medallion -->
  <g filter="url(#royalShadow)">
    <circle cx="300" cy="300" r="280" fill="url(#discBg)" stroke="url(#gold24k)" stroke-width="8"/>
    <!-- Intricate beaded coin border -->
    <circle cx="300" cy="300" r="268" fill="none" stroke="url(#gold24k)" stroke-width="2.5" stroke-dasharray="3, 5" stroke-opacity="0.85"/>
    <circle cx="300" cy="300" r="258" fill="none" stroke="url(#gold24k)" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="300" cy="300" r="192" fill="none" stroke="url(#gold24k)" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="300" cy="300" r="185" fill="none" stroke="url(#gold24k)" stroke-width="1" stroke-dasharray="2, 4" stroke-opacity="0.6"/>
  </g>

  <!-- Curved Typography Path Top & Bottom -->
  <defs>
    <!-- Top Arc Path -->
    <path id="topArc" d="M 75 300 A 225 225 0 0 1 525 300" fill="none"/>
    <!-- Bottom Arc Path -->
    <path id="bottomArc" d="M 525 300 A 225 225 0 0 1 75 300" fill="none"/>
  </defs>

  <!-- Arched Brand Typography -->
  <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="9" fill="url(#gold24k)" filter="url(#goldGlow)">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      LOOK TOOK JEWELLERS
    </textPath>
  </text>

  <text font-family="'Montserrat', sans-serif" font-size="19" font-weight="600" letter-spacing="7" fill="#E8D48B" fill-opacity="0.95">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ESTD. 2014 • GOGAWAN
    </textPath>
  </text>

  <!-- Diamond Star Separators -->
  <g transform="translate(68, 300) scale(0.9)" fill="url(#gold24k)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3"/>
  </g>
  <g transform="translate(532, 300) scale(0.9)" fill="url(#gold24k)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3"/>
  </g>

  <!-- Inner Heritage Heraldic Shield -->
  <g transform="translate(300, 315)">
    <!-- Royal Shield Contour -->
    <path d="M 0 -105 C 55 -105 88 -85 95 -45 C 98 25 55 80 0 115 C -55 80 -98 25 -95 -45 C -88 -85 -55 -105 0 -105 Z"
          fill="url(#shieldGrad)" stroke="url(#gold24k)" stroke-width="3"/>
    
    <!-- Inner Filigree Line -->
    <path d="M 0 -96 C 48 -96 76 -78 82 -42 C 85 20 48 68 0 100 C -48 68 -85 20 -82 -42 C -76 -78 -48 -96 0 -96 Z"
          fill="none" stroke="url(#gold24k)" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Royal Crown Surmounting the Shield -->
    <g transform="translate(0, -112)" filter="url(#goldGlow)">
      <!-- Crown Base Arch -->
      <path d="M -48 0 Q 0 -6 48 0 L 44 8 Q 0 2 -44 8 Z" fill="url(#gold24k)"/>
      <!-- Crown Spikes & Fleur-de-lis -->
      <path d="M 0 -26 L 8 -10 L 4 -10 L 6 0 L -6 0 L -4 -10 L -8 -10 Z" fill="url(#gold24k)"/>
      <path d="M -22 -18 Q -32 -30 -38 -15 Q -28 -5 -16 -2 Z" fill="url(#gold24k)"/>
      <path d="M 22 -18 Q 32 -30 38 -15 Q 28 -5 16 -2 Z" fill="url(#gold24k)"/>
      <circle cx="0" cy="-28" r="3" fill="#FFF8DC"/>
      <circle cx="-38" cy="-16" r="2.5" fill="#FFF8DC"/>
      <circle cx="38" cy="-16" r="2.5" fill="#FFF8DC"/>
      <circle cx="-20" cy="4" r="1.5" fill="#FFF8DC"/>
      <circle cx="0" cy="4" r="1.8" fill="#FFF8DC"/>
      <circle cx="20" cy="4" r="1.5" fill="#FFF8DC"/>
    </g>

    <!-- Interlaced Royal Monogram 'LT' (Look Took) -->
    <g font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" fill="url(#gold24k)" filter="url(#goldGlow)" text-anchor="middle">
      <!-- Ornate L -->
      <text x="-16" y="28" font-size="82" letter-spacing="-2">L</text>
      <!-- Ornate T overlapping -->
      <text x="18" y="38" font-size="88" fill="#FFEAA7" opacity="0.95">T</text>
    </g>

    <!-- Center Faceted Solitaire Accent -->
    <g transform="translate(0, 52) scale(0.65)" stroke="url(#gold24k)" stroke-width="2" fill="none">
      <polygon points="0,22 -18,0 -12,-10 12,-10 18,0" fill="rgba(255,234,167,0.2)"/>
      <line x1="-12" y1="-10" x2="0" y2="22"/>
      <line x1="12" y1="-10" x2="0" y2="22"/>
      <line x1="0" y1="-10" x2="0" y2="22"/>
      <circle cx="0" cy="2" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
