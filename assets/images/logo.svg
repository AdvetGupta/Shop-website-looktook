<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7A9"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#darkBg)"/>
  <rect width="490" height="490" x="5" y="5" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Crown Motif -->
  <g transform="translate(250, 140)" filter="url(#glow)">
    <!-- Central Fleur / Spear -->
    <path d="M0 -45 L12 -20 L6 -20 L10 0 L-10 0 L-6 -20 L-12 -20 Z" fill="url(#goldGrad)"/>
    <!-- Left Crown Spire -->
    <path d="M-18 -8 C-35 -30 -60 -35 -65 -15 C-55 10 -20 5 -10 5 Z" fill="url(#goldGrad)"/>
    <!-- Right Crown Spire -->
    <path d="M18 -8 C35 -30 60 -35 65 -15 C55 10 20 5 10 5 Z" fill="url(#goldGrad)"/>
    <!-- Crown Arch Base -->
    <path d="M-70 12 Q0 -5 70 12 Q55 22 0 16 Q-55 22 -70 12 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-48" r="3.5" fill="#FFF8DC"/>
    <circle cx="-65" cy="-17" r="3" fill="#FFF8DC"/>
    <circle cx="65" cy="-17" r="3" fill="#FFF8DC"/>
  </g>

  <!-- Diamond / Jewel Emblem -->
  <g transform="translate(250, 220)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Outer Contour -->
    <polygon points="0,95 -85,5 -65,-35 65,-35 85,5" fill="rgba(212,175,55,0.06)"/>
    <!-- Top Table -->
    <polygon points="-40,-35 40,-35 60,5 -60,5" fill="rgba(247,231,169,0.15)"/>
    <!-- Center Kite -->
    <polygon points="0,-35 40,-35 0,5 -40,-35" fill="rgba(255,255,255,0.08)"/>
    <!-- Bottom Facet Lines -->
    <line x1="-60" y1="5" x2="0" y2="95"/>
    <line x1="60" y1="5" x2="0" y2="95"/>
    <line x1="0" y1="5" x2="0" y2="95"/>
    <!-- Side Triangles -->
    <polygon points="-85,5 -60,5 0,95"/>
    <polygon points="85,5 60,5 0,95"/>
    <!-- Sparkle Accents -->
    <circle cx="0" cy="5" r="2.5" fill="#FFF8DC"/>
  </g>

  <!-- Brand Typography -->
  <text x="250" y="375" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="38" font-weight="700" letter-spacing="8" fill="url(#goldGrad)">
    LOOK TOOK
  </text>
  <text x="250" y="410" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="14" font-weight="500" letter-spacing="9" fill="#E8D48B" fill-opacity="0.9">
    JEWELLERS
  </text>
  <line x1="160" y1="428" x2="340" y2="428" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="250" cy="428" r="2" fill="url(#goldGrad)"/>
</svg>
