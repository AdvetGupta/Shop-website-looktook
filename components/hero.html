<section class="hero-section" id="home">
    <!-- Floating Luxury Sparkle Particles -->
    <div class="floating-particle" style="top: 15%; left: 20%;"></div>
    <div class="floating-particle" style="top: 70%; left: 75%;"></div>
    <div class="floating-particle" style="top: 38%; right: 18%;"></div>
    <div class="floating-particle" style="bottom: 22%; left: 32%;"></div>
    <div class="floating-particle" style="top: 28%; right: 28%;"></div>

    <!-- Continuous Floating & Orbiting Luxury Jewelry Showcase -->
    <div class="hero-interactive-showcase">
        <!-- Center Orbiting Ring (Circular Motion) -->
        <div class="hero-orbit-stage">
            <div class="hero-orbit-track">
                <div class="orbit-satellite sat-1" title="Gold Bangle">
                    <img src="assets/images/luxury_bangle.png" alt="Gold Bangle">
                </div>
                <div class="orbit-satellite sat-2" title="Engagement Diamond Ring">
                    <img src="assets/images/luxury_ring.png" alt="Diamond Ring">
                </div>
                <div class="orbit-satellite sat-3" title="Emerald Drop Earrings">
                    <img src="assets/images/luxury_earring.png" alt="Gold Earrings">
                </div>
                <div class="orbit-satellite sat-4" title="Solitaire Gold Necklace">
                    <img src="assets/images/luxury_necklace.png" alt="Gold Necklace">
                </div>
            </div>
        </div>

        <!-- Continuous Popping & Floating Bubbles Background (Continuous Loop) -->
        <div class="continuous-bubble-container">
            <div class="bubble-pod pod-1" style="--delay: 0s; --x: 6%; --dur: 11s;">
                <div class="bubble-lens">
                    <img src="assets/images/luxury_bracelet.png" alt="Charm Bracelet">
                </div>
            </div>
            <div class="bubble-pod pod-2" style="--delay: 2.2s; --x: 88%; --dur: 12.5s;">
                <div class="bubble-lens">
                    <img src="assets/images/luxury_pendant.png" alt="Radiance Pendant">
                </div>
            </div>
            <div class="bubble-pod pod-3" style="--delay: 4.5s; --x: 14%; --dur: 10s;">
                <div class="bubble-lens">
                    <img src="assets/images/earing.png" alt="Bridal Earrings">
                </div>
            </div>
            <div class="bubble-pod pod-4" style="--delay: 1.2s; --x: 80%; --dur: 13s;">
                <div class="bubble-lens">
                    <img src="assets/images/chain.png" alt="Gold Chain">
                </div>
            </div>
            <div class="bubble-pod pod-5" style="--delay: 6s; --x: 4%; --dur: 12s;">
                <div class="bubble-lens">
                    <img src="assets/images/mangalsutra.png" alt="Heritage Mangalsutra">
                </div>
            </div>
            <div class="bubble-pod pod-6" style="--delay: 3.8s; --x: 90%; --dur: 11.5s;">
                <div class="bubble-lens">
                    <img src="assets/images/pendants.png" alt="Diamond Pendants">
                </div>
            </div>
        </div>
    </div>

    <!-- Hero Center Content -->
    <div class="hero-center">
        <!-- Prominent Brand Emblem Medallion -->
        <div class="hero-crest-badge">
            <img src="assets/images/logo_crest.svg" alt="Look Took Jewellers Official Seal" class="hero-crest-img">
        </div>

        <div class="hero-company-name">
            Look Took Jewellers
        </div>
        <div class="hero-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            Since 2014 • Sarafa Bajar, Gogawan, Shahpura [Gogaon], MP 451335
        </div>

        <h2 class="hero-title">
            Discover <span>Timeless</span><br>Jewelry Collections
        </h2>

        <p class="hero-subtitle">
            Handcrafted with passion, each piece tells a story of heritage,<br>
            elegance, and unmatched craftsmanship.
        </p>

        <!-- CTA Buttons -->
        <div class="hero-cta-group">
            <a href="#collections" class="hero-cta">
                Explore Collections
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
            <a href="#contact" class="hero-cta-secondary">
                Visit Showroom
            </a>
        </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
        <span>Scroll</span>
        <div class="scroll-line"></div>
    </div>
</section>
